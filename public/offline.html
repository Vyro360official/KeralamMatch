<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | KeralamMatch</title>
  <style>
    body {
      background-color: #FCFBF7;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #0A369D;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #636366;
      font-size: 16px;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn {
      background-color: #0A369D;
      color: white;
      padding: 12px 32px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(10,54,157,0.1);
    }
  </style>
</head>
<body>
  <div class="logo">KeralamMatch</div>
  <h1>Connection Interrupted</h1>
  <p>It looks like you are currently offline. Check your network settings and we'll automatically reconnect once you're online.</p>
  <a href="/dashboard" class="btn">Retry Reconnect</a>
</body>
</html>
